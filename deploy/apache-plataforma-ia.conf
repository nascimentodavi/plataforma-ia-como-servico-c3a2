# Virtual host do Apache para a Plataforma de IA (proxy reverso -> gateway).
# Troque ia.SEUDOMINIO.com.br pelo seu subdominio. O bloco HTTPS (:443) e
# gerado automaticamente pelo certbot a partir deste arquivo:
#     certbot --apache -d ia.SEUDOMINIO.com.br
# (o certbot copia este vhost para *-le-ssl.conf com o certificado e cria o
#  redirecionamento HTTP -> HTTPS).

<VirtualHost *:80>
    ServerName ia.SEUDOMINIO.com.br

    ProxyPreserveHost On
    ProxyTimeout 60
    # Informa ao gateway se a requisicao original era http ou https.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # Desafio do Let's Encrypt nunca vai para o proxy.
    ProxyPass /.well-known/acme-challenge !

    # UI de rastreamento (Jaeger) protegida por senha.
    <Location /jaeger>
        AuthType Basic
        AuthName "Jaeger - Plataforma de IA"
        AuthUserFile /etc/apache2/.htpasswd-plataforma-ia
        Require valid-user
    </Location>
    ProxyPass        /jaeger  http://127.0.0.1:16686/jaeger
    ProxyPassReverse /jaeger  http://127.0.0.1:16686/jaeger

    # Todo o resto -> API Gateway (unica porta de entrada da aplicacao).
    # (a regra mais especifica, /jaeger, precisa vir ANTES desta)
    ProxyPass        /  http://127.0.0.1:8000/
    ProxyPassReverse /  http://127.0.0.1:8000/

    ErrorLog  ${APACHE_LOG_DIR}/plataforma-ia-erro.log
    # Formato SEM query string e SEM IP completo (minimizacao de dados - LGPD).
    LogFormat "%{%Y-%m-%dT%H:%M:%S}t \"%m %U\" %>s %D" plataforma_ia_minimo
    CustomLog ${APACHE_LOG_DIR}/plataforma-ia-acesso.log plataforma_ia_minimo
</VirtualHost>
