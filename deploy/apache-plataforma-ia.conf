# Virtual host do Apache para a Plataforma de IA (proxy reverso -> gateway).
#
# Topologia: Cloudflare (HTTPS publico) -> Apache :443 (certificado Let's Encrypt
# do dominio) -> 127.0.0.1:8000 (container do gateway). O Apache nao serve
# arquivos deste projeto: ele so repassa as requisicoes para os containers.

# Log de acesso SEM IP e SEM query string (minimizacao de dados - LGPD).
LogFormat "%{%Y-%m-%dT%H:%M:%S}t \"%m %U\" %>s %D" plataforma_ia_minimo

<VirtualHost *:80>
    ServerName ia.nascimentodavi.dev.br
    Redirect permanent / https://ia.nascimentodavi.dev.br/
</VirtualHost>

<VirtualHost *:443>
    ServerName ia.nascimentodavi.dev.br

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/nascimentodavi.dev.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/nascimentodavi.dev.br/privkey.pem

    ProxyPreserveHost On
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto "https"

    # UI de rastreamento (Jaeger) protegida por senha.
    <Location /jaeger>
        AuthType Basic
        AuthName "Jaeger - Plataforma de IA"
        AuthUserFile /etc/apache2/.htpasswd-plataforma-ia
        Require valid-user
    </Location>
    ProxyPass        /jaeger  http://127.0.0.1:16686/jaeger
    ProxyPassReverse /jaeger  http://127.0.0.1:16686/jaeger

    # Todo o resto -> API Gateway (unica porta de entrada da aplicacao).
    # (a regra mais especifica, /jaeger, precisa vir ANTES desta)
    ProxyPass        /  http://127.0.0.1:8000/
    ProxyPassReverse /  http://127.0.0.1:8000/

    ErrorLog  ${APACHE_LOG_DIR}/plataforma-ia-erro.log
    CustomLog ${APACHE_LOG_DIR}/plataforma-ia-acesso.log plataforma_ia_minimo
</VirtualHost>
