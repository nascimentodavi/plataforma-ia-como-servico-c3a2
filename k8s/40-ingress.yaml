apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plataforma-ia
  namespace: plataforma-ia
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt   # HTTPS automatico
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ia.seudominio.com.br]
      secretName: plataforma-ia-tls
  rules:
    - host: ia.seudominio.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: gateway, port: {number: 8000}}}
