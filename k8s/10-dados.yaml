apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis, namespace: plataforma-ia}
spec:
  serviceName: redis
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes", "--save", ""]
          ports: [{containerPort: 6379}]
          readinessProbe: {exec: {command: ["redis-cli", "ping"]}, periodSeconds: 5}
          volumeMounts: [{name: dados, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: dados}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: plataforma-ia}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: qdrant, namespace: plataforma-ia}
spec:
  serviceName: qdrant
  replicas: 1
  selector: {matchLabels: {app: qdrant}}
  template:
    metadata: {labels: {app: qdrant}}
    spec:
      containers:
        - name: qdrant
          image: docker.io/qdrant/qdrant:v1.12.4
          ports: [{containerPort: 6333}]
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom: {secretKeyRef: {name: plataforma-segredos, key: QDRANT_API_KEY}}
          readinessProbe: {tcpSocket: {port: 6333}, periodSeconds: 5}
          volumeMounts: [{name: dados, mountPath: /qdrant/storage}]
  volumeClaimTemplates:
    - metadata: {name: dados}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: qdrant, namespace: plataforma-ia}
spec: {selector: {app: qdrant}, ports: [{port: 6333}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: jaeger, namespace: plataforma-ia}
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      containers:
        - name: jaeger
          image: docker.io/jaegertracing/all-in-one:1.62.0
          env: [{name: COLLECTOR_OTLP_ENABLED, value: "true"}]
          ports: [{containerPort: 16686}, {containerPort: 4318}]
---
apiVersion: v1
kind: Service
metadata: {name: jaeger, namespace: plataforma-ia}
spec:
  selector: {app: jaeger}
  ports: [{name: ui, port: 16686}, {name: otlp-http, port: 4318}]
